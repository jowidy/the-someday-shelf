name: Mobile check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: someday-shelf-mobile-check
  cancel-in-progress: false
jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/shelf-qa" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/shelf-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check published site
        env:
          SHELF_BASE_URL: https://jowidy.github.io/the-someday-shelf/
          NODE_PATH: ${{ runner.temp }}/shelf-qa/node_modules
        run: node .github/qa/mobile.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: someday-shelf-mobile-qa
          path: ${{ runner.temp }}/shelf-screenshots/
          if-no-files-found: warn
